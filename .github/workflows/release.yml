# Making a tag like v1.76 (on the Releases page) builds the Windows Setup.exe and portable zip
# and the Linux .tar.gz, then attaches them to that release (the guide PDFs stay in docs/).
# (Actions > Release > Run workflow also builds them for testing, without a release.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup (for the installer)
        run: choco install innosetup -y --no-progress
      - name: Build the Setup.exe and the portable zip
        # build_windows.bat only finds Python and then waits for a key; call its worker directly.
        run: python tools/build_windows.py
      - name: Check both files were made
        shell: bash
        run: ls -l output/JS8Map_Spotter_v*_Setup.exe output/JS8Map_Spotter_v*_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            output/JS8Map_Spotter_v*_Setup.exe
            output/JS8Map_Spotter_v*_windows.zip

  linux:
    # Built on Ubuntu 22.04 (glibc 2.35), so the package runs on Mint 21, Ubuntu 22.04, Debian 12 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and venv for the build
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
      - name: Build the .tar.gz
        run: sh build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: output/JS8Map_Spotter_v*_linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Check the tag matches APP_VERSION in js8map_runtime.py
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -Eq "^APP_VERSION *= *['\"]$V['\"]" js8map_runtime.py || { echo "Tag $GITHUB_REF_NAME but js8map_runtime.py says otherwise"; exit 1; }
      - name: Release notes from CHANGELOG.md (the section for this version)
        run: |
          V="${GITHUB_REF_NAME#v}"
          R="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          TAG="$(sed -n "s/^STATREP_BUILD *= *'\([^']*\)'.*/\1/p" js8map_statrep.py)"
          awk -v v="$V" '/^## /{if (f) exit; f=($2==v)} f' CHANGELOG.md | tail -n +2 > body.md
          [ -s body.md ] || { echo "CHANGELOG.md has no '## $V' section"; exit 1; }
          echo "RELEASE_NAME=JS8Map Spotter $V" >> "$GITHUB_ENV"
          {
            echo "## Downloads"
            echo ""
            echo "| System | File | How to install |"
            echo "|---|---|---|"
            echo "| Windows 10/11 | \`JS8Map_Spotter_v${V}_build_${TAG}_Setup.exe\` | Double-click, Next, Install. Updating keeps your settings. |"
            echo "| Windows (no install) | \`JS8Map_Spotter_v${V}_build_${TAG}_windows.zip\` | Extract All into Documents, double-click \`JS8Map.exe\`. |"
            echo "| Linux (Mint 21 / Ubuntu 22.04 or newer) | \`JS8Map_Spotter_v${V}_build_${TAG}_linux.tar.gz\` | Save it in Downloads and paste the two lines from the Linux Quick Install. |"
            echo ""
            echo "If Windows says \"Windows protected your PC\", click **More info > Run anyway**. The program isn't code-signed."
            echo ""
            echo "Guides (PDF): Windows Quick Install, Linux Quick Install and the User Guide, in the [docs]($R/tree/main/docs) folder."
            echo "In JS8Call set **TCP Max Connections** to **5** and restart it."
            echo ""
            echo "## What's new"
            echo ""
            cat body.md
            echo ""
            echo "---"
            echo "Full history: [CHANGELOG.md]($R/blob/main/CHANGELOG.md)."
          } > notes.md
          cat notes.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: notes.md
          make_latest: true
          files: |
            out/windows/JS8Map_Spotter_v*_Setup.exe
            out/windows/JS8Map_Spotter_v*_windows.zip
            out/linux/JS8Map_Spotter_v*_linux.tar.gz
